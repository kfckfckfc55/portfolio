<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <meta name="theme-color" content="#050b1f">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-spider-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-spider-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Mọi nội dung được lấy từ data.js – không cần sửa file này -->

  <!-- ========== Thanh điều hướng ========== -->
  <nav class="nav" id="nav" aria-label="Menu">
    <span class="nav-pill" id="navPill" aria-hidden="true"></span>
    <span class="nav-buddy" id="navBuddy" aria-hidden="true"><svg viewBox="0 0 64 64">  <!-- tai -->
  <path fill="#17171c" d="M8 33 L12.5 6.5 Q14 3.5 16.8 5.4 L30 17 Z"/>
  <path fill="#17171c" d="M56 33 L51.5 6.5 Q50 3.5 47.2 5.4 L34 17 Z"/>
  <path fill="#e8c39a" d="M13 25 L15.2 11 L24.5 18.6 Z"/>
  <path fill="#e8c39a" d="M51 25 L48.8 11 L39.5 18.6 Z"/>
  <!-- đầu -->
  <ellipse cx="32" cy="37" rx="24.5" ry="21" fill="#17171c"/>
  <!-- viền nâu vàng + má kem (urajiro) -->
  <path fill="#c98a4b" d="M11.5 38.5 Q13 55.5 32 59.5 Q51 55.5 52.5 38.5 Q46 45 39.5 42.5 Q36 38.5 32 38.5 Q28 38.5 24.5 42.5 Q18 45 11.5 38.5 Z"/>
  <path fill="#f6ead9" d="M13.5 41 Q16 55 32 58 Q48 55 50.5 41 Q45 46.5 39 44.6 Q35.8 41 32 41 Q28.2 41 25 44.6 Q19 46.5 13.5 41 Z"/>
  <!-- chấm lông mày -->
  <ellipse cx="22.5" cy="27.5" rx="3.4" ry="2.3" fill="#d99a5b"/>
  <ellipse cx="41.5" cy="27.5" rx="3.4" ry="2.3" fill="#d99a5b"/>
  <!-- mắt -->
  <g class="eyes">
    <ellipse cx="23" cy="34.2" rx="3.3" ry="3.5" fill="#050507" stroke="#3a2a1f" stroke-width="1"/>
    <ellipse cx="41" cy="34.2" rx="3.3" ry="3.5" fill="#050507" stroke="#3a2a1f" stroke-width="1"/>
    <circle cx="24.3" cy="32.9" r="1.25" fill="#fff"/>
    <circle cx="42.3" cy="32.9" r="1.25" fill="#fff"/>
  </g>
  <!-- mũi, miệng, lưỡi -->
  <path fill="#ff8fa3" d="M29.6 51.2 Q32 57.2 34.4 51.2 Z"/>
  <ellipse cx="32" cy="45.6" rx="4.2" ry="2.9" fill="#0b0b0e"/>
  <ellipse cx="30.9" cy="44.7" rx="1.2" ry=".7" fill="#fff" opacity=".55"/>
  <path d="M32 48.3 V50.4 M27.4 50.6 Q29.8 53.3 32 50.4 Q34.2 53.3 36.6 50.6" fill="none" stroke="#0b0b0e" stroke-width="1.4" stroke-linecap="round"/>
</svg></span>
    <a href="#home" class="nav-link" data-sec="home" data-t="nav.home"></a>
    <a href="#about" class="nav-link" data-sec="about" data-t="nav.about"></a>
    <a href="#portfolio" class="nav-link" data-sec="portfolio" data-t="nav.portfolio"></a>
    <a href="#contact" class="nav-link" data-sec="contact" data-t="nav.contact"></a>
    <button class="lang" id="lang" type="button" aria-label="VI / EN">EN</button>
  </nav>

  <!-- Thước đo độ cao -->
  <div class="alt" id="alt" aria-hidden="true">
    <span class="alt-val" id="altVal">0 m</span>
    <span class="alt-scale"><span class="alt-track"></span></span>
    <span class="alt-col"><span class="alt-dot" id="altDot"></span></span>
    <span class="alt-lbl" data-t="alt"></span>
  </div>

  <main>
    <!-- ========== 1. HERO ========== -->
    <section class="hero" id="home">
      <div class="hero-bg" id="heroBg"></div>
      <canvas class="hero-aurora" id="aurora" aria-hidden="true"></canvas>
      <canvas class="hero-stars" id="stars" aria-hidden="true"></canvas>
      <svg class="hero-mountains" id="heroMountains" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b5998"/><stop offset="1" stop-color="#14254d"/></linearGradient>
          <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2f5e"/><stop offset="1" stop-color="#0a1530"/></linearGradient>
          <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1a38"/><stop offset="1" stop-color="#020617"/></linearGradient>
        </defs>
        <g data-depth="0.1"><path fill="url(#g1)" d="M0 270 L110 215 L200 250 L330 160 L450 230 L560 180 L720 60 L850 175 L960 135 L1080 215 L1200 125 L1320 205 L1440 165 V420 H0Z"/><path fill="#e6eeff" d="M720 60 L772 106 L750 101 L734 116 L716 98 L692 110 L676 96Z"/></g>
        <g data-depth="0.2"><path fill="url(#g2)" d="M0 310 L130 255 L250 295 L390 225 L520 290 L650 240 L790 305 L910 250 L1050 300 L1190 235 L1330 290 L1440 260 V420 H0Z"/></g>
        <g data-depth="0.32"><path fill="url(#g3)" d="M0 360 Q180 315 360 352 T720 345 T1080 355 T1440 335 V420 H0Z"/></g>
      </svg>
      <div class="hero-mist" aria-hidden="true"></div>
      <img class="hero-fg" id="heroFg" alt="" aria-hidden="true">
      <div class="hero-shade"></div>
      <div class="hero-text">
        <p class="hero-hello reveal" data-t="hero.hello"></p>
        <h1 class="hero-name reveal" data-f="name"></h1>
        <p class="hero-role reveal" data-f="role"></p>
      </div>
      <a class="hero-scroll" href="#about" aria-label="Scroll"><span></span></a>
    </section>

    <!-- ========== 2. VỀ TÔI ========== -->
    <section class="about topo-dark" id="about">
      <div class="wrap">
        <p class="kicker reveal" data-t="k.about"></p>
        <h2 class="title-xl reveal" data-t="about.title"></h2>

        <div class="intro">
          <div class="intro-a reveal">
            <p class="intro-hi" data-t="about.hi"></p>
            <h3 class="intro-name" data-f="name"></h3>
            <a class="btn" id="cvBtn" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
              <span data-t="btn.cv"></span>
            </a>
          </div>
          <div class="intro-b reveal">
            <div class="portrait" id="portrait"></div>
            <p class="portrait-hint" id="portraitHint" hidden><i></i><span data-t="hint"></span></p>
          </div>
          <div class="intro-c reveal">
            <p class="intro-text" data-f="about"></p>
            <a class="btn" href="#portfolio">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>
              <span data-t="btn.projects"></span>
            </a>
          </div>
        </div>

        <div class="journey">
          <div class="journey-col reveal">
            <h3 data-t="about.edu"></h3>
            <ol class="steps" id="eduList"></ol>
          </div>
          <div class="journey-col reveal">
            <h3 data-t="about.exp"></h3>
            <ol class="steps" id="expList"></ol>
          </div>
        </div>

        <div class="folders" id="folders"></div>
      </div>
    </section>

    <!-- ========== 3. CHỮ LỚN ========== -->
    <section class="mega topo-dark" aria-hidden="true">
      <span class="mega-moon" id="megaMoon"></span>
      <p class="mega-text" id="megaText">PORTFOLIO</p>
      <span class="mega-arrow">↘</span>
    </section>

    <!-- ========== 4. PORTFOLIO ========== -->
    <section class="works topo-light" id="portfolio">
      <div class="wrap">
        <p class="kicker dark reveal" data-t="k.pf"></p>
        <h2 class="title-xl dark reveal" data-t="pf.title"></h2>
        <div class="tabs reveal" id="tabs" role="tablist">
          <span class="tabs-pill" id="tabsPill"></span>
        </div>
      </div>
      <div class="carousel reveal">
        <button class="car-btn prev" id="prev" type="button" aria-label="Trước">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="track" id="track"></div>
        <button class="car-btn next" id="next" type="button" aria-label="Sau">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </section>

    <!-- ========== 5. ẢNH HOẠT ĐỘNG ========== -->
    <section class="gallery topo-light" id="gallery" hidden>
      <div class="gallery-title reveal">
        <p class="kicker dark" data-t="k.gal"></p>
        <h2 data-t="gal.title"></h2>
        <p data-t="gal.sub"></p>
      </div>
      <div class="gallery-stage" id="galleryStage"></div>
    </section>

    <!-- ========== 6. LIÊN HỆ ========== -->
    <section class="contact topo-light" id="contact">
      <div class="wrap">
        <p class="kicker dark reveal" data-t="k.ct"></p>
        <h2 class="title-xl dark reveal" data-t="ct.title"></h2>
        <div class="contact-grid">
          <form class="panel form reveal" id="form">
            <h3 class="panel-blue" data-t="ct.formTitle"></h3>
            <p class="panel-lead" data-t="ct.formLead"></p>
            <label class="inp">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
              <input name="n" required data-ph="ct.name">
            </label>
            <label class="inp">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
              <input name="e" type="email" required data-ph="ct.email">
            </label>
            <label class="inp area">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <textarea name="m" rows="5" required data-ph="ct.msg"></textarea>
            </label>
            <button class="btn full" type="submit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
              <span data-t="ct.send"></span>
            </button>
          </form>

          <div class="panel findme reveal">
            <h3 data-t="ct.find"></h3>
            <ul id="socials"></ul>
            <div class="findme-photo" id="contactPhoto"></div>
          </div>
        </div>
      </div>
      <footer class="foot">© <span id="yr"></span> <b data-f="name"></b>. <span data-t="foot"></span></footer>
    </section>
  </main>

  <!-- Hộp chi tiết -->
  <dialog class="modal" id="modal">
    <button class="modal-x" type="button" aria-label="Đóng" data-close>×</button>
    <div id="modalBody"></div>
  </dialog>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
